  --idle-fg:#6B6860; --idle-bg:#EFEDE6;

  --r-lg:20px; --r-md:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(26,26,23,.04), 0 8px 24px -12px rgba(26,26,23,.14);
  --shadow-lift:0 2px 4px rgba(26,26,23,.05), 0 18px 40px -18px rgba(26,26,23,.22);

  --display:'Apfel Grotezk Fett',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --mono:'PT Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;
  --editorial:'Bradford',Georgia,'Times New Roman',serif;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit}

.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* ── Hero ───────────────────────────────────────────────────── */
.hero{padding:34px 0 6px;text-align:center}
.hero__mark{
  font-family:var(--display);font-weight:400;
  font-size:clamp(40px,16.5vw,205px);
  line-height:.86;letter-spacing:-.05em;
  margin:0;
}
.hero__rule{height:1.5px;background:var(--ink);margin:22px 0 15px}
.hero__eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.hero__name{font-family:var(--display);font-weight:400;font-size:clamp(19px,4.6vw,29px);letter-spacing:-.02em;margin-top:7px}
/* Same voice as the client name, a step down in size and tone so the
   hierarchy stays clear. Width is set in px, not ch — Apfel's average
   glyph is only .42em wide, so a ch-based column would end up narrower
   than the name sitting above it. */
.hero__sub{
  margin:13px auto 0;max-width:560px;color:var(--ink-2);
  font-family:var(--display);font-weight:400;
  font-size:clamp(14px,2.6vw,18px);line-height:1.3;letter-spacing:-.015em;
}

/* ── Summary strip ──────────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin:30px 0 26px}
.stat{background:var(--surface);padding:15px 16px 14px}
.stat__n{font-family:var(--display);font-weight:400;font-size:26px;line-height:1;letter-spacing:-.03em}
.stat__l{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:7px}
.stat--alert .stat__n{color:var(--warn-fg)}

/* ── Controls ───────────────────────────────────────────────── */
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  padding:7px 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);transition:.15s ease;white-space:nowrap;
}
.chip:hover{border-color:var(--ink-3)}
.chip.is-on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip i{font-style:normal;margin-left:6px;opacity:.5;font-size:10px}
.chip.is-on i{opacity:.75}
.search{
  margin-left:auto;position:relative;
}
.search input{
  font-family:var(--body);font-size:13.5px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:9px 15px 9px 34px;width:230px;outline:none;transition:.15s;
}
.search input:focus{border-color:var(--ink);width:270px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.4}

/* ── Order list ─────────────────────────────────────────────── */
.orders{display:flex;flex-direction:column;gap:10px;padding-bottom:80px}

.order{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);transition:box-shadow .22s ease, border-color .22s ease;
  overflow:hidden;
}
.order:hover{box-shadow:var(--shadow-lift)}
.order.is-open{border-color:var(--ink)}

.order__head{
  display:grid;grid-template-columns:minmax(180px,1.15fr) 130px minmax(180px,1.2fr) auto 34px;
  align-items:start;gap:20px;width:100%;text-align:left;padding:18px 20px;
}
.order__head:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.k{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:5px}
.order__no{font-family:var(--mono);font-size:13.5px;letter-spacing:-.01em;font-weight:400}
.order__date{font-size:13.5px;color:var(--ink-2)}
.order__addr{font-size:13px;line-height:1.45;color:var(--ink-2)}
.order__sum{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--ink-3);margin-top:7px;white-space:nowrap}
.order__addr b{color:var(--ink);font-weight:600}
.order__caret{align-self:center;justify-self:end;color:var(--ink-3);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.order.is-open .order__caret{transform:rotate(180deg);color:var(--ink)}

.pill{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  padding:5px 10px;border-radius:999px;white-space:nowrap;
  background:var(--idle-bg);color:var(--idle-fg);
}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.pill--ok{background:var(--ok-bg);color:var(--ok-fg)}
.pill--warn{background:var(--warn-bg);color:var(--warn-fg)}
.pill--bad{background:var(--bad-bg);color:var(--bad-fg)}
.pill--info{background:var(--info-bg);color:var(--info-fg)}

/* accordion body */
.order__panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s cubic-bezier(.2,.8,.2,1)}
.order.is-open .order__panel{grid-template-rows:1fr}
.order__panelIn{overflow:hidden}
.order__body{padding:4px 20px 22px;border-top:1px solid var(--line-2);margin-top:2px}

.body__meta{display:flex;flex-wrap:wrap;gap:8px 26px;padding:14px 0 18px}
.body__meta div{font-size:13px;color:var(--ink-2)}
.body__meta span{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-right:7px}

/* ── Product (colorway) cards ───────────────────────────────── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);
  display:flex;flex-direction:column;overflow:hidden;
}
.card__top{display:flex;gap:14px;padding:14px}
.card__media{
  flex:0 0 92px;height:92px;border-radius:var(--r-sm);background:var(--paper-2);
  border:1px solid var(--line-2);overflow:hidden;display:grid;place-items:center;
}
.card__media img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.card__media .ph{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink-3)}
.card__id{min-width:0;flex:1}
.card__name{font-family:var(--display);font-weight:400;font-size:16.5px;letter-spacing:-.015em;line-height:1.2;margin:1px 0 7px;word-break:break-word}
.colorway{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.dot{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:none}
.card__qty{margin-top:10px;display:flex;align-items:baseline;gap:6px}
.card__qty b{font-family:var(--display);font-weight:400;font-size:23px;letter-spacing:-.03em;line-height:1}
.card__qty i{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

/* signature: size run */
.run{padding:0 14px 14px}
.run__bar{display:flex;height:7px;border-radius:99px;overflow:hidden;background:var(--paper-2);gap:1.5px}
.run__seg{background:var(--ink);opacity:.86;min-width:3px}
.run__seg:nth-child(2n){opacity:.66}
.run__seg:nth-child(3n){opacity:.74}
.run__list{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.sz{
  font-family:var(--mono);font-size:11px;letter-spacing:.02em;
  border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--ink-2);
  display:inline-flex;gap:6px;align-items:baseline;background:var(--surface);
}
.sz b{color:var(--ink);font-weight:400}

/* card meta rows */
.rows{border-top:1px solid var(--line-2);padding:11px 14px;display:grid;gap:7px}
.row{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:baseline;font-size:13px}
.row>span{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.row a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink-3);word-break:break-all}
.row a:hover{border-bottom-color:var(--ink)}
.mono{font-family:var(--mono);font-size:12.5px}
.ext{display:inline-block;vertical-align:-1px;margin-left:2px;opacity:.6}
a:hover .ext{opacity:1}

/* proof block */
.proof{border-top:1px solid var(--line-2);padding:12px 14px;background:#FBFAF7;margin-top:auto}
.proof__head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.proof__label{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.proof__note{margin-top:9px;font-size:12.5px;color:var(--ink-2);background:var(--surface);
  border:1px solid var(--line);border-left:2.5px solid var(--bad-fg);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:8px 10px}
.proof__note em{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.proof__actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.proof__tag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-2);background:var(--paper-2);border-radius:4px;padding:3px 6px}
/* several proofs on one product read as one set, not four separate blocks */
.proofset{margin-top:auto;border-top:1px solid var(--line-2);background:#FBFAF7}
.proofset__h{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);padding:11px 14px 0}
.proofset .proof{border-top:0;background:transparent;margin-top:0;padding:10px 14px}
.proofset .proof + .proof{border-top:1px dashed var(--line)}

.btn{
  display:inline-flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  padding:8px 13px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:#fff;
  transition:.15s ease;text-decoration:none;
}
.btn:hover{opacity:.85}
.btn--ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn--ghost:hover{border-color:var(--ink);opacity:1}
.btn svg{flex:none}

/* ── Order-level proofs strip ───────────────────────────────── */
.oproofs{border:1px solid var(--line);border-radius:var(--r-md);background:#FBFAF7;padding:12px 14px;margin-bottom:12px}
.oproofs__h{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px}
.oproofs ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.oproofs li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.oproofs li b{font-weight:600}
.oproofs li i{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.oproofs li .btn{margin-left:auto;padding:6px 11px}

/* ── States ─────────────────────────────────────────────────── */
.state{padding:70px 24px;text-align:center;color:var(--ink-2)}
.state h3{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:-.02em;margin:0 0 6px;color:var(--ink)}
.state p{margin:0;font-size:14px}
.skel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);height:86px;margin-bottom:10px;
  position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.045),transparent);animation:sh 1.35s infinite}
@keyframes sh{100%{transform:translateX(100%)}}

/* ── Proof modal ────────────────────────────────────────────── */
.modal{position:fixed;inset:0;z-index:100;display:none}
.modal.is-open{display:block}
.modal__bg{position:absolute;inset:0;background:rgba(26,26,23,.55);backdrop-filter:blur(3px);animation:fade .2s ease}
.modal__box{
  position:absolute;inset:22px;background:var(--surface);border-radius:var(--r-lg);
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 40px 90px -30px rgba(0,0,0,.5);
  animation:pop .26s cubic-bezier(.2,.8,.2,1);
}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}}
.modal__bar{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);flex:none}
.modal__title{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal__bar .btn{padding:6px 11px}
.modal__bar .spacer{margin-left:auto}
.modal iframe{flex:1;width:100%;border:0;background:var(--paper)}

/* ── Sample-data banner ─────────────────────────────────────── */
.notice{
  display:none;align-items:flex-start;gap:11px;
  background:var(--warn-bg);color:var(--warn-fg);
  border:1px solid rgba(138,91,0,.22);border-radius:var(--r-md);
  padding:12px 14px;margin:0 0 18px;font-size:13px;line-height:1.45;
}
.notice.is-on{display:flex}
.notice b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;margin-bottom:3px}
.notice svg{flex:none;margin-top:1px}

/* ── Debug panel (?debug) ───────────────────────────────────── */
.dbg{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:90;max-height:46vh;
  background:#16160F;color:#DFDCD2;border-top:2px solid var(--ink);
  font-family:var(--mono);font-size:11.5px;line-height:1.55;overflow:auto;
}
.dbg.is-on{display:block}
.dbg__bar{position:sticky;top:0;display:flex;gap:10px;align-items:center;
  padding:9px 14px;background:#16160F;border-bottom:1px solid #33322A;color:#9C998F;
  font-size:10px;letter-spacing:.09em;text-transform:uppercase}
.dbg__bar button{margin-left:auto;color:#DFDCD2;border:1px solid #44433A;border-radius:6px;
  padding:4px 9px;font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase}
.dbg__body{padding:12px 14px 20px;white-space:pre-wrap;word-break:break-word}
.dbg h4{margin:14px 0 5px;color:#E6C87A;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.09em;text-transform:uppercase;font-weight:400}
.dbg h4:first-child{margin-top:0}
.dbg .bad{color:#F0907F}
.dbg .good{color:#93D3A2}

/* ── Reveal ─────────────────────────────────────────────────── */
.rv{opacity:0;transform:translateY(12px)}
.rv.in{opacity:1;transform:none;transition:opacity .5s ease, transform .5s cubic-bezier(.2,.8,.2,1)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
  .rv{opacity:1;transform:none}
}

/* ── Responsive ─────────────────────────────────────────────── */
@media (max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:760px){
  .wrap{padding:0 16px}
  .hero{padding:22px 0 4px}
  .hero__rule{margin:16px 0 13px}
  .hero__sub{font-size:15px;line-height:1.3;max-width:22em}
  .order__head{grid-template-columns:1fr auto;gap:14px 12px;padding:16px}
  .order__head .cell--date{grid-column:1}
  .order__head .cell--addr{grid-column:1 / -1}
  .order__head .cell--status{grid-column:1}
  .order__caret{grid-column:2;grid-row:1;align-self:start}
  .cards{grid-template-columns:1fr}
  .search{margin-left:0;width:100%}
  .search input{width:100%}
  .search input:focus{width:100%}
  .modal__box{inset:0;border-radius:0}
  .row{grid-template-columns:82px 1fr}
}
</style>
</head>
<body>

<main class="wrap">
  <section class="hero">
    <h1 class="hero__mark">OPENHOUSE</h1>
    <div class="hero__rule"></div>
    <div class="hero__eyebrow">Client Portal</div>
    <div class="hero__name" id="heroClient">&mdash;</div>
    <p class="hero__sub">Every order you&rsquo;ve placed with us, live. Open a row to see each colorway, its size run, tracking, and proof status.</p>
  </section>

  <div class="notice" id="notice">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4.5M12 16h.01"/></svg>
    <div><b id="noticeTitle">Preview</b><span id="noticeText"></span></div>
  </div>

  <section class="stats rv" id="stats" hidden></section>

  <div class="controls rv" id="controls" hidden>
    <div class="chips" id="chips"></div>
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input type="search" id="q" placeholder="Search order #, product, address…" aria-label="Search orders">
    </label>
  </div>

  <section class="orders" id="orders">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </section>
</main>

<div class="dbg" id="dbg">
  <div class="dbg__bar">Webhook diagnostics <span id="dbgVer" style="color:#E6C87A"></span> <button onclick="document.getElementById('dbg').classList.remove('is-on')">Hide</button></div>
  <div class="dbg__body" id="dbgBody"></div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Proof">
  <div class="modal__bg" data-close></div>
  <div class="modal__box">
    <div class="modal__bar">
      <div class="modal__title" id="modalTitle">Proof</div>
      <div class="spacer"></div>
      <a class="btn btn--ghost" id="modalOpen" target="_blank" rel="noopener">Open in new tab</a>
      <button class="btn btn--ghost" data-close aria-label="Close proof">Close</button>
    </div>
    <iframe id="modalFrame" title="Proof" referrerpolicy="no-referrer"></iframe>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   CONFIG
   ══════════════════════════════════════════════════════════════ */
const CONFIG = {
  /* Bump this on every deploy. Shown in the ?debug panel so you can tell
     at a glance whether the live domain is serving the newest file. */
  VERSION: 'p22-multi-proof',
  // Make webhook that returns this client's orders.
  // Called as: WEBHOOK_URL + '?record_id=' + <id from the page URL>
  WEBHOOK_URL: 'https://hook.us2.make.com/abrea6i91eeauu8xzxhb6vmy2tpb9fl2',

  /* "Back to Work Note" in Design Requests mixes client feedback with
     internal chatter (staff @-mentions, other clients' names, priority
     instructions). Off by default — turn on only if that field gets
     cleaned up or split into a client-safe one. */
  SHOW_PROOF_NOTES: false,

  // Fall back to sample data when the webhook isn't reachable yet.
  // While true, a yellow banner appears whenever sample data is shown,
  // so you always know which source you're looking at. Set to false for launch.
  DEMO_FALLBACK: true
};

/* ══════════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════════ */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const EXT = '<svg class="ext" width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.2 6.8 6.9 3.1M6.9 3.1H3.9M6.9 3.1v3"/></svg>';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Airtable sends lookups as arrays (["Acme"]), attachments as [{url}],
   failed formulas as {state:'error', value:null}. Flatten all of that. */
function clean(v){
  if(v === null || v === undefined || v === '') return '';
  if(Array.isArray(v)){
    const f = v.map(clean).filter(x => x !== '' && x !== undefined);
    if(!f.length) return '';
    return f.length === 1 ? f[0] : f;
  }
  if(typeof v === 'object'){
    if('state' in v && 'value' in v) return v.state === 'error' ? '' : clean(v.value);
    if(v.url) return v.url;
    if(v.name) return v.name;
    if(v.email) return v.email;
    return '';
  }
  return typeof v === 'string' ? v.trim() : v;
}

/* Airtable attachments carry a full-size url plus thumbnails. Cards are
   ~92px, so prefer the 512px thumbnail — some originals are 16MB. */
function imageUrl(v){
  const first = Array.isArray(v) ? v[0] : v;
  if(!first) return '';
  if(typeof first === 'string') return first.trim();
  const t = first.thumbnails || {};
  return (t.large && t.large.url) || (t.full && t.full.url) || first.url || '';
}

/* Structural reader: same tolerant name matching, but returns the value
   untouched. Use for arrays of records and nested objects. */
function pickRaw(obj, names, dflt=null){
  if(!obj || typeof obj !== 'object') return dflt;
  const list = [].concat(names);
  /* Exact key names win. Airtable payloads can carry both "Record ID"
     (the order) and "record_id" (the webhook's own param) — normalising
     would collapse them into one and the wrong value could win. */
  for(const n of list){
    const v = obj[n];
    if(v !== undefined && v !== null && v !== '') return v;
  }
  const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
  const map = {};
  for(const k of Object.keys(obj)) if(!(norm(k) in map)) map[norm(k)] = obj[k];
  for(const n of list){
    const v = map[norm(n)];
    if(v !== undefined && v !== null && v !== '') return v;
  }
  return dflt;
}

/* Scalar reader — matches names ignoring case/spaces/underscores, and
   flattens Airtable's lookup arrays and wrapper objects via clean(). */
function pick(obj, names, dflt=''){
  if(!obj || typeof obj !== 'object') return dflt;
  const list = [].concat(names);
  for(const n of list){
    if(n in obj){
      const v = clean(obj[n]);
      if(v !== '' && v !== undefined && v !== null) return v;
    }
  }
  const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
  const map = {};
  for(const k of Object.keys(obj)) if(!(norm(k) in map)) map[norm(k)] = obj[k];
  for(const n of list){
    const v = clean(map[norm(n)]);
    if(v !== '' && v !== undefined && v !== null) return v;
  }
  return dflt;
}
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^\d.\-]/g,'')); return isNaN(n) ? 0 : n; };
const truthy = v => v === true || ['true','yes','1','checked','✓'].includes(String(v ?? '').trim().toLowerCase());

function fmtDate(v){
  if(!v) return '';
  const d = new Date(v);
  if(isNaN(d)) return String(v);
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const mon=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `${days[d.getDay()]} ${d.getDate()} ${mon[d.getMonth()]}, ${d.getFullYear()}`;
}
const sortableDate = v => { const d = new Date(v); return isNaN(d) ? 0 : d.getTime(); };

/* size ordering */
const SIZE_RANK = ['osfa','onesize','os','xxs','2xs','xs','s','sm','small','m','md','medium','l','lg','large',
  'xl','xlarge','2xl','xxl','3xl','xxxl','4xl','xxxxl','5xl','6xl'];
function sizeRank(s){
  const k = String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
  const i = SIZE_RANK.indexOf(k);
  if(i > -1) return i;
  const n = parseFloat(k);
  return isNaN(n) ? 500 : 600 + n;
}

/* status → pill flavour */
function pillClass(status){
  const s = String(status).toLowerCase();
  if(/complete|delivered|shipped|approved|closed/.test(s)) return 'pill--ok';
  if(/reject|change|declin|hold|issue|cancel/.test(s))     return 'pill--bad';
  if(/requires art|client art|awaiting art|need.*artwork/.test(s)) return 'pill--warn';
  if(/await|pend|proof|review|approval|sent/.test(s))      return 'pill--warn';
  if(/pack|pick|label|fulfil/.test(s))                     return 'pill--info';
  if(/production|print|progress|process|transit/.test(s))  return 'pill--info';
  return '';
}

/* colour name → swatch hex (used when no hex supplied) */
const NAMED = {black:'#111111',white:'#FFFFFF',navy:'#1B2A4A',red:'#C0342B',royal:'#1E45A0',blue:'#2B5CA8',
  green:'#2C6B45',forest:'#254A32',grey:'#9A9A96',gray:'#9A9A96',charcoal:'#4A4A48',heather:'#B9B7B1',
  sand:'#D9CBB2',natural:'#E9E1CE',cream:'#F2EBDC',khaki:'#B7A98A',olive:'#5C5F3D',maroon:'#6D2230',
  burgundy:'#5C1F2C',orange:'#D2691E',yellow:'#E5B93C',gold:'#C8A045',pink:'#DD8CA5',purple:'#5B3A78',
  brown:'#6B4A32',tan:'#C9AB86',silver:'#C6C6C2',teal:'#20666B'};
function swatchHex(color, given){
  if(given){ const g = String(given).trim(); return g.startsWith('#') ? g : '#'+g; }
  const words = String(color).toLowerCase().split(/[^a-z]+/).filter(Boolean);
  for(const w of words) if(NAMED[w]) return NAMED[w];
  return '#D6D2C8';
}

/* Some Airtable fields hold a markdown link rather than a bare value:
   "[1ZC15A060...](http://wwwapps.ups.com/WebTracking/...)". Split it. */
function parseLinkish(v){
  const raw = String(v ?? '').trim();
  const m = raw.match(/^\[([^\]]+)\]\(\s*(\S+?)\s*\)$/);
  return m
    ? {text: m[1].trim(), url: m[2].trim().replace(/^http:\/\//i, 'https://')}
    : {text: raw, url: ''};
}

/* tracking URL from carrier when Make doesn't supply one */
function trackUrl(carrier, tn, given){
  if(given) return given;
  if(!tn) return '';
  const raw = String(tn).trim();
  const t = encodeURIComponent(raw);
  let c = String(carrier).toLowerCase();

  /* Carrier is often blank while the number itself identifies the courier. */
  if(!c || c === 'other'){
    const d = raw.replace(/\s/g, '');
    if(/^1Z/i.test(d))                     c = 'ups';
    else if(/^(94|93|92|95)\d{18,20}$/.test(d)) c = 'usps';
    else if(/^(96\d{18}|\d{12}|\d{15})$/.test(d)) c = 'fedex';
    else if(/^\d{10}$/.test(d))            c = 'dhl';
  }

  if(c.includes('ups'))   return 'https://www.ups.com/track?tracknum=' + t;
  if(c.includes('fedex')) return 'https://www.fedex.com/fedextrack/?trknbr=' + t;
  if(c.includes('usps'))  return 'https://tools.usps.com/go/TrackConfirmAction?tLabels=' + t;
  if(c.includes('dhl'))   return 'https://www.dhl.com/us-en/home/tracking.html?tracking-id=' + t;
  return 'https://www.google.com/search?q=' + t;
}

/* ══════════════════════════════════════════════════════════════
   NORMALISE — accepts nested {orders:[{items:[]}]} or a flat
   list of Airtable line-item rows, and folds them into orders.
   ══════════════════════════════════════════════════════════════ */
function normalise(raw){
  let clientName = '';
  let rows = [];
  let nestedOrders = null;
  let orderRows = null, itemRows = null, proofRows = null;

  if(Array.isArray(raw)) rows = raw;
  else if(raw && typeof raw === 'object'){
    clientName = pick(raw, ['clientName','client','customer','company','companyName','name']);
    if(clientName && typeof clientName === 'object') clientName = pick(clientName, ['name','clientName']);

    const o  = pickRaw(raw, ['orders','salesOrders']);
    const it = pickRaw(raw, ['items','lineItems','salesOrderLineItems']);
    proofRows = pickRaw(raw, ['proofs','designRequests','design_requests']);

    /* Shape A: separate orders + items arrays — what Make sends with two
       Airtable modules. Joined here, so Airtable needs no extra lookups. */
    if(Array.isArray(o) && Array.isArray(it)){ orderRows = o; itemRows = it; }
    else if(Array.isArray(o) && o.length && (o[0].items || o[0].Items || o[0].lineItems)) nestedOrders = o;
    else rows = (Array.isArray(o) && o) || pickRaw(raw, ['items','records','lineItems','data','results'], []);
  }

  const unwrap = a => [].concat(a || []).map(r => (r && r.fields && typeof r.fields === 'object') ? {...r.fields, id:r.id} : r);
  rows = unwrap(Array.isArray(rows) ? rows : []);

  let orders;
  if(orderRows){
    orderRows = unwrap(orderRows);
    itemRows  = unwrap(itemRows);
    orders = joinOrdersAndItems(orderRows, itemRows, unwrap(proofRows).map(mapProof));
    if(!clientName) clientName = pick(orderRows[0] || {}, ['companyName','clientName','client','customer','company']);
  } else if(nestedOrders){
    orders = nestedOrders.map(o => {
      const items = [].concat(pickRaw(o, ['items','lineItems','products'], []) || []).map(mapItem);
      return buildOrder(o, items);
    });
  } else {
    const byOrder = new Map();
    for(const r of rows){
      const no = String(orderNoOf(r) || '—');
      if(!byOrder.has(no)) byOrder.set(no, {seed:r, items:[]});
      byOrder.get(no).items.push(mapItem(r));
    }
    orders = [...byOrder.entries()].map(([no, g]) => buildOrder({...g.seed, orderNo:no}, g.items));
  }

  orders.sort((a,b) => b.ts - a.ts);
  if(!clientName) clientName = pick(rows[0] || {}, ['companyName','clientName','client','customer','company']) || '';
  return {clientName: String(clientName || 'Client'), orders};
}

const orderNoOf = r => pick(r, ['orderNo','order #','orderNumber','order','orderId','Order Number','Name'], '');

/* Matches each line item to its order by record ID, falling back to order number. */
function joinOrdersAndItems(orderRows, itemRows, proofs){
  const byId = new Map(), byNo = new Map();
  const buckets = orderRows.map(o => {
    const b = {row:o, items:[], proofs:[]};
    /* register every id the order might be referenced by */
    for(const k of ['Record ID','recordID','recordId','id']){
      const v = clean(pickRaw(o, [k], ''));
      if(v && String(v).startsWith('rec')) byId.set(String(v), b);
    }
    const no = String(orderNoOf(o) || '');
    if(no) byNo.set(no.toLowerCase(), b);
    return b;
  });

  let orphans = 0;
  for(const it of itemRows){
    const refs = [].concat(
      pickRaw(it, ['order_recID','orderRecordId','orderRecId','salesOrderRecordId','parentOrder','Order #','salesOrder'], []) || []
    );
    let b = null;
    for(const r of refs) if(byId.has(String(r))){ b = byId.get(String(r)); break; }
    if(!b){
      const no = String(pick(it, ['Order # f','orderNoText','orderNo','orderNumber'], '')).toLowerCase();
      if(no && byNo.has(no)) b = byNo.get(no);
    }
    if(b) b.items.push(mapItem(it)); else orphans++;
  }
  window.__portalOrphans = orphans;
  if(orphans) console.warn('Portal: ' + orphans + ' line item(s) could not be matched to an order.');

  let proofOrphans = 0;
  for(const p of (proofs || [])){
    let b = null;
    for(const r of [].concat(p.orderRef || [])) if(byId.has(String(r))){ b = byId.get(String(r)); break; }
    /* A few Design Requests span two orders, so OrderID arrives as
       "recA,recB" and won't match by id — fall back to the order number. */
    if(!b){
      for(const r of [].concat(p.orderRef || ''))
        for(const part of String(r).split(/[,\s]+/))
          if(part && byId.has(part)){ b = byId.get(part); break; }
      if(!b && p.orderNo){
        const no = String(p.orderNo).toLowerCase();
        if(byNo.has(no)) b = byNo.get(no);
      }
    }
    if(b) b.proofs.push(p); else proofOrphans++;
  }
  window.__portalProofOrphans = proofOrphans;

  return buckets.map(b => buildOrder(b.row, b.items, b.proofs));
}

function mapItem(r){
  return {
    product: productName(r),
    color:   String(pick(r, ['variantColor','FS Color Variant (from Products_new)','color','colour','colorway','baseColor','garmentColor'], '')),
    colorHex:String(pick(r, ['colorHex','hex','colourHex','baseHex'], '')),
    size:    String(pick(r, ['variantSize','FS Size Variant (from Products_new)','size','sizeName'], '')),
    qty:     num(pick(r, ['quantity','qty','productionQuantity','units','count'], 0)),
    /* legacy rows carry all sizes in one text field: "S: 9\nM: 19\nL: 23" */
    sizeText:String(pick(r, ['sizeBreakdown','sizes','sizeRun'], '')),
    image:   imageUrl(pickRaw(r, ['productImage','image','imageUrl','mockup','mockupUrl','proofImage','photo'])),
    carrier: String(pick(r, ['carrier','shippingCarrier'], '')),
    tracking:parseLinkish(pick(r, ['trackingNumber','trackNumber','tracking'], '')).text,
    trackingUrl:String(pick(r, ['trackingUrl','trackUrl','trackingLink'], ''))
                || parseLinkish(pick(r, ['trackingNumber','trackNumber','tracking'], '')).url,
    eta:     String(pick(r, ['customerEtaDisplay','customerETADisplay','eta','customerEta'], '')),
    clientStatus: String(pick(r, ['client_status','clientStatus'], '')),
    approvalDate: String(pick(r, ['workApprovalDate','approvalDate'], '')),
    sigReceived:  truthy(pick(r, ['proofSignatureReceived','signatureProofReceived','signatureProofRecieved'], '')),
    unsignedProof:String(pick(r, ['unsignedProof','unsignedProofUrl','unsignedProofDoc'], '')),
    digitalProof: String(pick(r, ['digitalProof','digitalProofUrl','proofUrl','proofLink','clientProofLink'], '')),
    proofStatus:  String(pick(r, ['proofStatus','proofState','clientProofStatus'], '')),
    proofComment: String(pick(r, ['proofComment','backToWorkNote','changeRequest','proofNote','clientProofNote'], '')),
    proofDate:    String(pick(r, ['proofApprovedDate','proofReceivedModifiedTime','proofRecievedTime','proofReceivedTime','proofSentDate'], ''))
  };
}

/* One Design Request ≈ one proof for one product in an order. */
function mapProof(r){
  /* proof_url is stored as http:// — an https page cannot iframe http
     content, browsers block it as mixed content. Force https. */
  const url = String(pick(r, ['proof_url','proofUrl','proofLink'], '')).replace(/^http:\/\//i, 'https://');
  return {
    name:       String(pick(r, ['Request Name','requestName','designName'], '')),
    version:    String(pick(r, ['Proof Version','proofVersion'], '')),
    status:     String(pick(r, ['Status','status'], '')),
    sig:        truthy(pick(r, ['Proof Signature Received','proofSignatureReceived'], '')),
    approvedAt: String(pick(r, ['Work Approval Date','workApprovalDate'], '')),
    sentAt:     String(pick(r, ['Proof Recieved Time','Proof Received Time'], '')),
    rejected:   truthy(pick(r, ['Reject the artwork','rejectTheArtwork'], '')),
    reason:     String(pick(r, ['Reason','rejectionReason'], '')),
    note:       String(pick(r, ['Back to Work Note','backToWorkNote'], '')),
    unsigned:   String(pick(r, ['Unsigned Proof','unsignedProof'], '')),
    signed:     String(pick(r, ['Signed Proof','signedProof'], '')),
    orderRef:   pickRaw(r, ['OrderID','orderRecordId','order_recID'], ''),
    orderNo:    String(pick(r, ['Order','orderNo','order #'], '')),
    /* fields that distinguish two proofs of the same product */
    color:      String(pick(r, ['Base Color','baseColor','Color SKU'], '')),
    variant:    String(pick(r, ['Variant','variantName'], '')).replace(/^[\s\-–]+|[\s\-–]+$/g, ''),
    designId:   String(pick(r, ['Design ID','designId'], '')),
    requestDate:String(pick(r, ['Request Date','requestDate'], '')),
    url
  };
}

/* With several proofs on one card, four identical "Proof approved V1" rows
   are indistinguishable. Pick the first field that actually differs. */
function proofTag(p){
  const v = [p.color, p.variant, p.designId && 'Design ' + p.designId,
             p.requestDate && fmtDate(p.requestDate)].find(x => x && /[a-z0-9]/i.test(x));
  return v || '';
}

/* Design "Status" tracks internal design work, not the client decision, so
   the client-facing state is derived from the signature + reject flags.
   Returns null when there is nothing meaningful to tell the client. */
function proofState(p){
  if(p.rejected)                            return {cls:'pill--bad',  label:'Changes requested'};
  if(p.sig)                                 return {cls:'pill--ok',   label:'Proof approved'};
  if(/proof sent|pending|await/i.test(p.status)) return {cls:'pill--warn', label:'Awaiting your approval'};
  return null;
}

/* Some rows have no product link at all (shipping lines, fees) and some
   carry junk like " - " in Style & Color. Walk the candidates and take the
   first that contains an actual word. */
function productName(r){
  const cands = ['FS Style Name (from Products_new)','productName','product','item','itemName',
                 'style','styleName','Style & Color','SKU_new','sku'];
  for(const c of cands){
    const v = String(pick(r, [c], '')).trim();
    if(/[a-z0-9]{2}/i.test(v)) return v.replace(/\s*-\s*$/, '').trim();
  }
  return 'Item';
}

/* Size labels that carry no information — never shown as a chip. */
const EMPTY_SIZE = /^(n\/?\.?a\.?|none|null|n\/a|-{1,2}|—|\.)$/i;

/* "S: 9\nM: 19\nL: 23\nXL: 19\nXXL: 6" → [{label:'S',qty:9}, …]
   Lines without a label:number pair (e.g. "90 totes per design") are ignored. */
function parseSizeText(txt){
  const out = [];
  String(txt || '').split(/[\n\r;|,]+/).forEach(part => {
    const m = part.match(/^\s*([A-Za-z0-9/\-\s]{1,14}?)\s*[:=]\s*([\d,.]+)\s*$/);
    if(m && !EMPTY_SIZE.test(m[1].trim())) out.push({label: m[1].trim().toUpperCase(), qty: num(m[2])});
  });
  return out;
}

/* Most common client_status across the order's line items. */
function itemStatus(items){
  const tally = new Map();
  for(const it of items){
    const v = (it.clientStatus || '').trim();
    if(v) tally.set(v, (tally.get(v) || 0) + 1);
  }
  if(!tally.size) return '';
  return [...tally.entries()].sort((a,b) => b[1] - a[1])[0][0];
}

function buildOrder(o, items, proofs){
  const created = pick(o, ['created','createdDate','createdShortForm','createdTime','date','orderDate','paidDate'], '');
  const ship = pickRaw(o, ['shippingAddress','shipping','shipTo','address']);
  const shipLines = Array.isArray(ship) ? ship
    : (typeof ship === 'string' && ship) ? ship.split(/\r?\n/)
    : [
        pick(o, ['shipName','attention','contactName','Ship Name']),
        pick(o, ['shipCompany','company','Ship Company']),
        pick(o, ['shipAddress1','address1','street','Ship Address']),
        [pick(o, ['shipCity','city']), [pick(o,['shipState','state']), pick(o,['shipZip','zip','postal'])].filter(Boolean).join(' ')].filter(Boolean).join(', '),
        pick(o, ['shipPhone','phone'])
      ];
  const shipObj = (ship && !Array.isArray(ship) && typeof ship === 'object') ? ship : null;
  const lines = (shipObj
      ? [pick(shipObj,['name','attention']), pick(shipObj,['company']), pick(shipObj,['address1','street','line1']),
         [pick(shipObj,['city']), [pick(shipObj,['state']), pick(shipObj,['zip','postal'])].filter(Boolean).join(' ')].filter(Boolean).join(', '),
         pick(shipObj,['phone'])]
      : shipLines
    ).map(x => String(x || '').trim()).filter(Boolean);

  let no = String(orderNoOf(o) || '—');
  if(no !== '—' && !no.startsWith('#')) no = '#' + no;

  const built = attachProofs(groupByColorway(items), proofs || []);
  /* every proof on this order that the client will actually see */
  const shown = built.proofs.concat(...built.groups.map(g => g.proofs || []))
                            .filter(p => proofState(p));

  return {
    no,
    created, ts: sortableDate(created),
    status: String(pick(o, ['status','orderStatus','Status'], '')) || itemStatus(items) || '—',
    shipLines: lines,
    poNumber: String(pick(o, ['po','poNumber','clientPo'], '')),
    inHands: String(pick(o, ['inHandsDate','inHands'], '')),
    ...built,
    proofCount: shown.length,
    needsReview: shown.some(p => { const st = proofState(p); return st && st.cls === 'pill--warn'; }),
    hasIssue: shown.some(p => { const st = proofState(p); return st && st.cls === 'pill--bad'; })
  };
}

/* A Design Request names its product ("Cotton Knit Ribbed Socks"), so match
   proofs to colourway cards by name. Anything that doesn't match a card is
   kept at order level rather than dropped — better a listed proof than a
   silently hidden one. */
function attachProofs(groups, proofs){
  const key = t => String(t).toLowerCase().replace(/[^a-z0-9]/g, '');
  const left = [];
  for(const p of proofs){
    const k = key(p.name);
    const hit = k && groups.find(g => key(g.product) === k);
    if(hit){ (hit.proofs = hit.proofs || []).push(p); } else left.push(p);
  }
  return {groups, proofs: left};
}

/* ── the merge: one card per product + colour ───────────────── */
function groupByColorway(items){
  const map = new Map();
  for(const it of items){
    const key = (it.product + '¦' + it.color).toLowerCase();
    if(!map.has(key)){
      map.set(key, {
        product: it.product, color: it.color, hex: swatchHex(it.color, it.colorHex),
        image: it.image, sizes: new Map(), total: 0,
        carrier: it.carrier, tracking: it.tracking, trackingUrl: it.trackingUrl,
        eta: it.eta, approvalDate: it.approvalDate, clientStatus: it.clientStatus,
        sigReceived: it.sigReceived, unsignedProof: it.unsignedProof, digitalProof: it.digitalProof,
        proofStatus: it.proofStatus, proofComment: it.proofComment, proofDate: it.proofDate
      });
    }
    const g = map.get(key);
    if(it.size && !EMPTY_SIZE.test(it.size.trim())){
      g.sizes.set(it.size, (g.sizes.get(it.size) || 0) + it.qty);
    } else if(it.sizeText){
      /* legacy single row: sizes live in one text field */
      for(const s of parseSizeText(it.sizeText))
        g.sizes.set(s.label, (g.sizes.get(s.label) || 0) + s.qty);
    }
    g.total += it.qty;
    // first non-empty value wins for shared attributes
    for(const f of ['image','carrier','tracking','trackingUrl','eta','approvalDate','unsignedProof','digitalProof','proofStatus','proofComment','proofDate','sizeText','clientStatus'])
      if(!g[f] && it[f]) g[f] = it[f];
    if(it.sigReceived) g.sigReceived = true;
  }
  return [...map.values()].map(g => ({
    ...g,
    sizes: [...g.sizes.entries()].sort((a,b) => sizeRank(a[0]) - sizeRank(b[0])).map(([label, qty]) => ({label, qty}))
  })).sort((a,b) => a.product.localeCompare(b.product) || a.color.localeCompare(b.color));
}

/* ══════════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════════ */
let STATE = {orders: [], filter: 'all', query: ''};

function proofChip(p, title, tag){
  const st = proofState(p);
  if(!st && !p.url) return '';
  const label = st ? st.label : 'Proof available';
  const cls   = st ? st.cls : '';
  const when  = p.sig && p.approvedAt ? fmtDate(p.approvedAt)
              : (!p.sig && p.sentAt ? 'Sent ' + fmtDate(p.sentAt) : '');
  const ver   = p.version ? `<span class="proof__label">V${esc(p.version)}</span>` : '';
  const mark  = tag ? `<span class="proof__tag">${esc(tag)}</span>` : '';

  /* Only surfaced when the note field is known to be client-safe. */
  const text = p.rejected ? (p.reason || p.note) : (CONFIG.SHOW_PROOF_NOTES ? p.note : '');
  const note = (p.rejected && text)
    ? `<div class="proof__note"><em>Your note</em>${esc(text)}</div>` : '';

  const actions = p.url ? `<div class="proof__actions">
    <button class="btn" data-proof="${esc(p.url)}" data-proof-title="${esc(title || p.name || 'Proof')}">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      ${p.sig ? 'View proof' : 'Review proof'}
    </button>
    <a class="btn btn--ghost" href="${esc(p.url)}" target="_blank" rel="noopener">New tab ${EXT}</a>
  </div>` : '';

  return `<div class="proof">
    <div class="proof__head"><span class="pill ${cls}">${esc(label)}</span>${mark}${ver}
      ${when ? `<span class="proof__label">${esc(when)}</span>` : ''}</div>
    ${note}${actions}
  </div>`;
}

/* Proof block on a colourway card: real Design Request first, then the
   legacy per-line-item fields as a fallback. */
function proofView(g){
  if(g.proofs && g.proofs.length){
    const many = g.proofs.length > 1;
    const body = g.proofs.map(p => proofChip(
      p,
      g.product + (g.color ? ' — ' + g.color : '') + (many && proofTag(p) ? ' — ' + proofTag(p) : ''),
      many ? proofTag(p) : ''
    )).join('');
    return many
      ? `<div class="proofset"><div class="proofset__h">${g.proofs.length} proofs for this product</div>${body}</div>`
      : body;
  }

  const st = String(g.proofStatus || '').trim();
  const link = g.digitalProof || '';
  if(!st && !link) return '';
  return proofChip({
    status: st, sig: /approv/i.test(st), rejected: /change|reject|declin/i.test(st),
    reason: g.proofComment, note: g.proofComment, approvedAt: g.proofDate,
    sentAt: g.proofDate, version: '', url: link
  }, g.product);
}

/* Proofs that name a product not present as a card — listed under the order. */
function orderProofsView(o){
  if(!o.proofs || !o.proofs.length) return '';
  const rows = o.proofs.map(p => {
    const st = proofState(p);
    if(!st && !p.url) return '';
    return `<li>
      <span class="pill ${st ? st.cls : ''}">${esc(st ? st.label : 'Proof available')}</span>
      <b>${esc(p.name || 'Proof')}</b>
      ${p.version ? `<i>V${esc(p.version)}</i>` : ''}
      ${p.url ? `<button class="btn btn--ghost" data-proof="${esc(p.url)}" data-proof-title="${esc(p.name || 'Proof')}">Open</button>` : ''}
    </li>`;
  }).filter(Boolean).join('');
  if(!rows) return '';
  return `<div class="oproofs"><div class="oproofs__h">Proofs for this order</div><ul>${rows}</ul></div>`;
}

function documentRow(g){
  if(!g.sigReceived) return '';
  const url = g.unsignedProof || g.digitalProof;
  if(!url) return '';
  const label = g.unsignedProof ? 'Signed proof' : 'Digital proof';
  return `<div class="row"><span>Document</span><a href="${esc(url)}" target="_blank" rel="noopener">${label} ${EXT}</a></div>`;
}

/* A product can sit at a different stage than its order — e.g. one item
   still waiting on the client's artwork while the rest await proof sign-off.
   Showing nothing there reads as "forgotten", so surface the item's own
   status whenever it differs from the order's. */
function itemStatusRow(g, orderStatus){
  const s = (g.clientStatus || '').trim();
  if(!s || s.toLowerCase() === String(orderStatus || '').trim().toLowerCase()) return '';
  return `<div class="row"><span>Status</span><div><span class="pill ${pillClass(s)}">${esc(s)}</span></div></div>`;
}

function cardView(g, orderStatus){
  const max = Math.max(1, ...g.sizes.map(s => s.qty));
  const bar = g.sizes.length
    ? `<div class="run__bar" aria-hidden="true">${g.sizes.map(s =>
        `<div class="run__seg" style="flex:${Math.max(s.qty, max*0.06)}"></div>`).join('')}</div>` : '';
  const chips = g.sizes.length
    ? `<div class="run__list">${g.sizes.map(s => `<span class="sz">${esc(s.label)} <b>${s.qty}</b></span>`).join('')}</div>`
    : '';

  const track = g.tracking
    ? `<div class="row"><span>Tracking</span><a class="mono" href="${esc(trackUrl(g.carrier, g.tracking, g.trackingUrl))}" target="_blank" rel="noopener">${esc(g.tracking)} ${EXT}</a></div>` : '';

  return `<article class="card">
    <div class="card__top">
      <div class="card__media">${g.image
        ? `<img src="${esc(g.image)}" alt="${esc(g.product + ' ' + g.color)}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'NO IMAGE'}))">`
        : `<div class="ph">NO IMAGE</div>`}</div>
      <div class="card__id">
        <h4 class="card__name">${esc(g.product)}</h4>
        ${g.color ? `<span class="colorway"><i class="dot" style="background:${esc(g.hex)}"></i>${esc(g.color)}</span>` : ''}
        <div class="card__qty"><b>${g.total.toLocaleString()}</b><i>pcs</i></div>
      </div>
    </div>
    ${(bar || chips) ? `<div class="run">${bar}${chips}</div>` : ''}
    <div class="rows">
      ${g.carrier ? `<div class="row"><span>Carrier</span><div>${esc(g.carrier)}</div></div>` : ''}
      ${track}
      ${g.eta ? `<div class="row"><span>ETA</span><div>${esc(g.eta)}</div></div>` : ''}
      ${g.approvalDate ? `<div class="row"><span>Approved</span><div>${esc(fmtDate(g.approvalDate))}</div></div>` : ''}
      ${itemStatusRow(g, orderStatus)}
      ${documentRow(g)}
    </div>
    ${proofView(g)}
  </article>`;
}

function orderView(o, i){
  const units = o.groups.reduce((n, g) => n + g.total, 0);
  const n = o.groups.length;
  /* Contents summary sits on the collapsed row, so the client can scan
     order sizes without opening anything. */
  const summary = n
    ? `${n} colorway${n === 1 ? '' : 's'} &middot; ${units.toLocaleString()} unit${units === 1 ? '' : 's'}`
    : 'No items yet';
  const extra = [
    o.poNumber ? `<div><span>PO</span>${esc(o.poNumber)}</div>` : '',
    o.inHands  ? `<div><span>In hands</span>${esc(fmtDate(o.inHands))}</div>` : ''
  ].filter(Boolean).join('');

  return `<section class="order rv" data-i="${i}">
    <button class="order__head" aria-expanded="false">
      <div class="cell--no">
        <span class="k">Order</span>
        <div class="order__no">${esc(o.no)}</div>
        <div class="order__sum">${summary}</div>
      </div>
      <div class="cell--date"><span class="k">Placed</span><div class="order__date">${esc(fmtDate(o.created)) || '—'}</div></div>
      <div class="cell--addr"><span class="k">Ships to</span><div class="order__addr">${
        o.shipLines.length ? o.shipLines.map((l, k) => k === 0 ? `<b>${esc(l)}</b>` : esc(l)).join('<br>') : '—'}</div></div>
      <div class="cell--status"><span class="k">Status</span><span class="pill ${pillClass(o.status)}">${esc(o.status)}</span></div>
      <svg class="order__caret" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="order__panel"><div class="order__panelIn"><div class="order__body">
      ${extra ? `<div class="body__meta">${extra}</div>` : '<div style="height:14px"></div>'}
      ${orderProofsView(o)}
      <div class="cards">${o.groups.map(g => cardView(g, o.status)).join('') || '<p style="color:var(--ink-3);font-size:13px">No line items on this order yet.</p>'}</div>
    </div></div></div>
  </section>`;
}

function statusBucket(s){
  const t = String(s).toLowerCase();
  if(/complete|delivered|closed/.test(t)) return 'complete';
  if(/proof|approval|await|review/.test(t)) return 'proof';
  if(/change|reject|declin|hold|issue/.test(t)) return 'attention';
  return 'active';
}

/* "Proofs" means the order has something to show; "Attention" means it
   wants the client to act. Both are about proofs, not the order status. */
function matchesFilter(o, f){
  if(f === 'all')       return true;
  if(f === 'proof')     return o.proofCount > 0;
  if(f === 'attention') return o.needsReview || o.hasIssue || statusBucket(o.status) === 'attention';
  return statusBucket(o.status) === f;
}

function render(){
  const list = STATE.orders.filter(o => {
    if(!matchesFilter(o, STATE.filter)) return false;
    if(!STATE.query) return true;
    const hay = (o.no + ' ' + o.status + ' ' + o.shipLines.join(' ') + ' ' +
      o.groups.map(g => g.product + ' ' + g.color + ' ' + g.tracking).join(' ')).toLowerCase();
    return hay.includes(STATE.query);
  });

  const el = $('#orders');
  el.innerHTML = list.length
    ? list.map(orderView).join('')
    : `<div class="state"><h3>Nothing matches that</h3><p>Clear the search or pick a different status.</p></div>`;

  // stash the filtered list so click handlers resolve the right order
  el._list = list;
  reveal();
}

function reveal(){
  const io = new IntersectionObserver((ents) => {
    ents.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, {rootMargin: '0px 0px -40px 0px'});
  $$('.rv:not(.in)').forEach((n, i) => { n.style.transitionDelay = Math.min(i, 6) * 35 + 'ms'; io.observe(n); });
}

function renderStats(){
  const o = STATE.orders;
  const c = b => o.filter(x => statusBucket(x.status) === b).length;
  const review = o.filter(x => x.needsReview).length;
  $('#stats').innerHTML = [
    ['Total orders', o.length, ''],
    ['In progress', c('active') + c('proof'), ''],
    ['Needs your review', review, review ? 'stat--alert' : ''],
    ['Completed', c('complete'), '']
  ].map(([l, n, cls]) => `<div class="stat ${cls}"><div class="stat__n">${n}</div><div class="stat__l">${l}</div></div>`).join('');
  $('#stats').hidden = false;

  /* A filter that can only return an empty screen is worse than no filter,
     so each chip shows its count and zero-count chips aren't rendered. */
  $('#chips').innerHTML = [['all','All'],['proof','Proofs'],['attention','Attention'],['active','In progress'],['complete','Complete']]
    .map(([k, l]) => {
      const n = STATE.orders.filter(x => matchesFilter(x, k)).length;
      if(!n && k !== 'all') return '';
      return `<button class="chip ${k === STATE.filter ? 'is-on' : ''}" data-f="${k}">${l}<i>${n}</i></button>`;
    }).join('');
  $('#controls').hidden = false;
}

/* ══════════════════════════════════════════════════════════════
   EVENTS
   ══════════════════════════════════════════════════════════════ */
document.addEventListener('click', e => {
  const head = e.target.closest('.order__head');
  if(head){
    const card = head.closest('.order');
    const open = card.classList.toggle('is-open');
    head.setAttribute('aria-expanded', open ? 'true' : 'false');
    return;
  }
  const proofBtn = e.target.closest('[data-proof]');
  if(proofBtn){ openProof(proofBtn.dataset.proof, proofBtn.dataset.proofTitle); return; }

  const chip = e.target.closest('.chip');
  if(chip){
    $$('.chip').forEach(c => c.classList.toggle('is-on', c === chip));
    STATE.filter = chip.dataset.f;
    render();
    return;
  }
  if(e.target.closest('[data-close]')) closeProof();
});

$('#q').addEventListener('input', e => { STATE.query = e.target.value.trim().toLowerCase(); render(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeProof(); });

function openProof(url, title){
  $('#modalFrame').src = url;
  $('#modalOpen').href = url;
  $('#modalTitle').textContent = title || 'Proof';
  $('#modal').classList.add('is-open');
  document.body.style.overflow = 'hidden';
}
function closeProof(){
  $('#modal').classList.remove('is-open');
  $('#modalFrame').src = 'about:blank';
  document.body.style.overflow = '';
}

/* ══════════════════════════════════════════════════════════════
   LOAD
   ══════════════════════════════════════════════════════════════ */
async function boot(){
  const params  = new URLSearchParams(location.search);
  const recordId = params.get('record_id') || params.get('client') || params.get('id') || '';
  const DEBUG   = params.has('debug');
  const diag    = {recordId, url:'', http:'', raw:'', err:'', source:''};

  let data = null;
  if(!recordId){
    diag.err = 'No record_id in the page URL.';
  } else if(CONFIG.WEBHOOK_URL.includes('REPLACE_ME')){
    diag.err = 'CONFIG.WEBHOOK_URL is not set.';
  } else {
    const sep = CONFIG.WEBHOOK_URL.includes('?') ? '&' : '?';
    diag.url = CONFIG.WEBHOOK_URL + sep + 'record_id=' + encodeURIComponent(recordId);
    try{
      const res  = await fetch(diag.url, {cache:'no-store'});
      const text = await res.text();
      diag.http = res.status + ' ' + res.statusText;
      diag.raw  = text;
      if(!res.ok){ diag.err = 'Webhook returned HTTP ' + res.status + '.'; }
      else{
        try { data = JSON.parse(text); }
        catch(e){ diag.err = 'Response is not valid JSON: ' + e.message; }
      }
    }catch(err){
      diag.err = 'Request blocked or failed: ' + err.message +
        ' — usually a missing Access-Control-Allow-Origin header on the Make webhook response.';
    }
  }

  diag.source = data ? 'webhook' : 'sample';
  /* Technical detail belongs in the console and the ?debug panel, never on
     screen. A client seeing a JSON parser error learns nothing useful. */
  if(diag.err) console.warn('Portal: ' + diag.err);

  if(!data){
    if(CONFIG.DEMO_FALLBACK || params.has('demo')){
      data = DEMO;
      $('#noticeTitle').textContent = DEBUG ? 'Sample data' : 'Preview';
      $('#noticeText').textContent = DEBUG
        ? diag.err + ' Showing sample data instead.'
        : 'This is a preview with placeholder orders. Real data appears once the connection is live.';
      $('#notice').classList.add('is-on');
    } else {
      /* Production failure: apologise, offer a retry, say nothing technical. */
      $('#orders').innerHTML = `<div class="state">
        <h3>We couldn&rsquo;t load your orders just now</h3>
        <p>This is usually temporary. Try again in a moment &mdash; if it keeps happening,
           reply to your last email from us and we&rsquo;ll sort it out.</p>
        <button class="btn" id="retry" style="margin-top:18px">Try again</button>
      </div>`;
      const r = $('#retry'); if(r) r.addEventListener('click', () => location.reload());
      if(DEBUG) showDebug(diag, null);
      return;
    }
  }

  const {clientName, orders} = normalise(data);
  STATE.orders = orders;
  $('#heroClient').textContent = clientName;
  document.title = clientName + ' — OPENHOUSE Client Portal';

  if(!orders.length){
    $('#orders').innerHTML = `<div class="state"><h3>No orders yet</h3><p>Once your first order is in the system it'll appear here.</p></div>`;
    return;
  }
  renderStats();
  render();
  if(DEBUG) showDebug(diag, {clientName, orders});
}

/* Shows exactly what the webhook returned and how it was understood.
   Add ?debug to the URL. Safe to leave in — invisible without the flag. */
function showDebug(d, parsed){
  const first = (() => {
    try{
      const j = JSON.parse(d.raw);
      const arr = Array.isArray(j) ? j : (j.records || j.items || j.orders || j.data || []);
      const r = arr[0];
      return (r && r.fields) ? r.fields : r;
    }catch{ return null; }
  })();

  const out = [];
  out.push(`<h4>Request</h4>record_id: ${esc(d.recordId) || '(none)'}\n${esc(d.url) || '(not called)'}`);
  out.push(`<h4>Response</h4>HTTP: ${esc(d.http) || '—'}\nData source used: <span class="${d.source === 'webhook' ? 'good' : 'bad'}">${d.source}</span>`);
  if(parsed){
    const total = parsed.orders.reduce((n, o) => n + o.proofCount, 0);
    const raw = (() => { try{ const j = JSON.parse(d.raw); return (j.proofs || j.designRequests || []).length; }catch{ return 0; } })();
    out.push(`<h4>Proofs</h4>received in payload: <span class="${raw ? 'good' : 'bad'}">${raw}</span>` +
      `\nmatched to an order: ${total}` +
      (window.__portalProofOrphans ? `\n<span class="bad">unmatched: ${window.__portalProofOrphans} — check OrderID on the Design Request</span>` : '') +
      (raw === 0 ? `\n<span class="bad">No "proofs" array in the response. Add the Design Requests search + aggregator in Make, then include "proofs": [{{17.array}}] in the webhook response body.</span>` : ''));
  }
  if(window.__portalOrphans)
    out.push(`<h4>Unmatched line items</h4><span class="bad">${window.__portalOrphans} line item(s) had no matching order — check that the orders array carries "Record ID" and the items carry "order_recID".</span>`);
  if(d.err) out.push(`<h4>Problem</h4><span class="bad">${esc(d.err)}</span>`);

  if(first && typeof first === 'object'){
    out.push(`<h4>Field names in the first record</h4>` +
      Object.keys(first).map(k => '• ' + esc(k) + ' = ' + esc(JSON.stringify(first[k])).slice(0, 90)).join('\n'));
  }
  if(parsed){
    out.push(`<h4>Understood as</h4>client: ${esc(parsed.clientName)}\norders: ${parsed.orders.length}\n` +
      parsed.orders.map(o => `  ${esc(o.no)} — ${o.groups.length} colorway(s), ` +
        o.groups.map(g => `${esc(g.product)}/${esc(g.color) || '(no color)'} ${g.total}pcs [${g.sizes.map(s => s.label + ':' + s.qty).join(' ') || 'no sizes'}]`).join(' | ')).join('\n'));
  }
  out.push(`<h4>Raw response (first 4000 chars)</h4>${esc(d.raw).slice(0, 4000) || '(empty)'}`);

  $('#dbgVer').textContent = '· build ' + CONFIG.VERSION;
  $('#dbgBody').innerHTML = out.join('\n\n');
  $('#dbg').classList.add('is-on');
}
